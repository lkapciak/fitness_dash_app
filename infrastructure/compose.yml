services:
  postgres:
    image: postgres:17
    container_name: fitness-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbt:
    build:
      context: ../fitness_dash_dbt
    container_name: fitness-dbt
    restart: "no"

    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ../fitness_dash_dbt:/app

    working_dir: /app

    depends_on:
      - postgres

    command: ["dbt", "--version"]

volumes:
  postgres_data: